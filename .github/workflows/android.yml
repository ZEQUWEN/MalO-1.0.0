name: Android build

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle files
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./build.sh

      - name: Run unit tests
        run: .gradle/bootstrap/gradle-9.3.1/bin/gradle --no-daemon --console=plain :app:testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MalO-debug-apk
          path: public/MalO-1.0.0.apk
          if-no-files-found: error
