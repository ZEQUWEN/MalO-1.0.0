name: Android build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle files
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./build.sh

      - name: Run unit tests
        run: |
          "${GRADLE_USER_HOME:-$GITHUB_WORKSPACE/.gradle}/bootstrap/gradle-9.3.1/bin/gradle" \
            --no-daemon --console=plain :app:testDebugUnitTest

      - name: Report unit-test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          def escape(value: str) -> str:
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          for report in pathlib.Path("app/build/test-results").rglob("TEST-*.xml"):
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      problem = case.find(tag)
                      if problem is None:
                          continue
                      title = f"{case.get('classname', '')}.{case.get('name', '')}"
                      details = problem.get("message") or problem.text or "Unit test failed"
                      print(f"::error title={escape(title)}::{escape(details[:3000])}")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MalO-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MalO-debug-apk
          path: public/MalO-1.0.0.apk
          if-no-files-found: error
